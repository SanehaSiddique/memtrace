<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEMTRACE</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #161b22;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4f8cff;
    --active: #3fb950;
    --historical: #d29922;
    --excluded: #f85149;
    --pending: #a371f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  header input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    width: 130px;
  }
  header label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: default; }

  main {
    display: grid;
    grid-template-columns: 320px 1fr 380px;
    gap: 1px;
    background: var(--border);
    min-height: calc(100vh - 61px);
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  section { background: var(--bg); padding: 16px; overflow-y: auto; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 10px 0;
  }

  textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    resize: vertical;
    min-height: 70px;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .log { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .log .entry { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; }
  .log .entry .q { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .log .entry .a { color: var(--text); }

  .answer-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    font-size: 16px;
    line-height: 1.5;
    min-height: 80px;
  }
  .answer-box.empty { color: var(--muted); font-size: 13px; }
  .meta { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
  .tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .mem-list { display: flex; flex-direction: column; gap: 8px; }
  .mem-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
  }
  .mem-card .triple { font-weight: 600; }
  .mem-card .content { color: var(--muted); margin-top: 4px; }
  .mem-card .reason { margin-top: 6px; font-size: 11px; padding: 6px 8px; border-radius: 6px; }
  .mem-card .reason.why-used { background: rgba(63,185,80,0.12); color: var(--active); }
  .mem-card .reason.why-ignored { background: rgba(248,81,73,0.12); color: var(--excluded); }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    margin-right: 6px;
    font-weight: 700;
  }
  .badge.ACTIVE { background: rgba(63,185,80,0.18); color: var(--active); }
  .badge.HISTORICAL { background: rgba(210,153,34,0.18); color: var(--historical); }
  .badge.PENDING_REVIEW { background: rgba(163,113,247,0.18); color: var(--pending); }
  .badge.ARCHIVED, .badge.DELETED { background: rgba(139,148,158,0.18); color: var(--muted); }
  .empty-note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>MEM<span>TRACE</span></h1>
  <div class="sub">memory &amp; context control layer — why did the agent remember this?</div>
  <label>agent_id
    <input id="agentId" value="agent-alpha" />
  </label>
  <label>conversation_id
    <input id="conversationId" value="demo_conversation" />
  </label>
  <button class="secondary" id="seedBtn">Seed demo data</button>
  <button class="secondary" id="refreshBtn">Refresh memory</button>
</header>

<main>
  <section id="left">
    <h2>Ask / Tell the agent</h2>
    <textarea id="input" placeholder="e.g. What database are we currently using?  OR  We migrated from MongoDB to PostgreSQL."></textarea>
    <div class="row">
      <button id="chatBtn">Chat (ingest + answer)</button>
      <button class="secondary" id="queryBtn">Query (read-only)</button>
    </div>
    <div class="log" id="log"></div>
  </section>

  <section id="center">
    <h2>Answer</h2>
    <div class="answer-box empty" id="answer">No query yet. Try "Seed demo data" then ask "What database are we currently using?"</div>
    <div class="meta" id="answerMeta"></div>
  </section>

  <section id="right">
    <h2>Memory inspector</h2>
    <div class="tabs">
      <button class="tab-btn active" data-tab="selected">Selected context</button>
      <button class="tab-btn" data-tab="excluded">Excluded (why ignored?)</button>
      <button class="tab-btn" data-tab="active">Active memories</button>
      <button class="tab-btn" data-tab="historical">Historical memories</button>
    </div>
    <div class="mem-list" id="memList"><div class="empty-note">Nothing yet.</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { selected: [], excluded: [], active: [], historical: [], tab: "selected" };

function agentId() { return $("agentId").value.trim() || "agent-alpha"; }
function conversationId() { return $("conversationId").value.trim() || "demo_conversation"; }

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`${method} ${path} -> ${res.status}`);
  return res.json();
}

function memoryLabel(m) {
  return `${m.subject} ${m.predicate.replaceAll("_", " ")} ${m.object}`;
}

function renderMemCard(item, kind) {
  const m = item.memory;
  const div = document.createElement("div");
  div.className = "mem-card";
  const reasonHtml =
    kind === "excluded"
      ? `<div class="reason why-ignored">why ignored: ${item.reason}</div>`
      : `<div class="reason why-used">why used: ${(item.retrieval_reason || []).join(", ") || "n/a"}${
          item.score !== undefined ? ` (score ${item.score.toFixed(2)})` : ""
        }</div>`;
  div.innerHTML = `
    <span class="badge ${m.status}">${m.status}</span>
    <span class="triple">${memoryLabel(m)}</span>
    <div class="content">${m.content}</div>
    ${reasonHtml}
  `;
  return div;
}

function renderTab() {
  const list = $("memList");
  list.innerHTML = "";
  const data = state[state.tab] || [];
  if (data.length === 0) {
    list.innerHTML = '<div class="empty-note">Nothing here yet.</div>';
    return;
  }
  const kind = state.tab === "excluded" ? "excluded" : "selected";
  data.forEach((item) => {
    // active/historical come back as raw Memory objects from GET /memory; wrap them.
    const wrapped = item.memory ? item : { memory: item, retrieval_reason: [], score: undefined };
    list.appendChild(renderMemCard(wrapped, kind));
  });
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.tab = btn.dataset.tab;
    renderTab();
  });
});

function appendLog(query, answer) {
  const log = $("log");
  const entry = document.createElement("div");
  entry.className = "entry";
  entry.innerHTML = `<div class="q">${query}</div><div class="a">${answer}</div>`;
  log.prepend(entry);
}

function renderAnswer(answer, meta) {
  const box = $("answer");
  box.classList.remove("empty");
  box.textContent = answer;
  $("answerMeta").innerHTML = meta
    ? `<span>selected: ${meta.selected_memory_count}</span><span>excluded: ${meta.excluded_memory_count}</span>`
    : "";
}

async function refreshMemories() {
  try {
    const [active, historical] = await Promise.all([
      api(`/memory?agent_id=${encodeURIComponent(agentId())}&status=ACTIVE`),
      api(`/memory?agent_id=${encodeURIComponent(agentId())}&status=HISTORICAL`),
    ]);
    state.active = active;
    state.historical = historical;
    renderTab();
  } catch (e) {
    console.error(e);
  }
}

async function runChat() {
  const message = $("input").value.trim();
  if (!message) return;
  const body = { message, conversation_id: conversationId(), agent_id: agentId() };
  const result = await api("/agent/chat", "POST", body);
  renderAnswer(result.answer, result.trace_metadata);
  appendLog(message, result.answer);
  state.selected = result.selected_memories;
  state.excluded = result.excluded_memories;
  renderTab();
  await refreshMemories();
}

async function runQuery() {
  const query = $("input").value.trim();
  if (!query) return;
  const body = { query, conversation_id: conversationId(), agent_id: agentId() };
  const result = await api("/memory/query", "POST", body);
  renderAnswer(result.answer, result.trace_metadata);
  appendLog(query, result.answer);
  state.selected = result.selected_memories;
  state.excluded = result.excluded_memories;
  renderTab();
}

$("chatBtn").addEventListener("click", () => runChat().catch((e) => alert(e.message)));
$("queryBtn").addEventListener("click", () => runQuery().catch((e) => alert(e.message)));
$("seedBtn").addEventListener("click", async () => {
  $("seedBtn").disabled = true;
  try {
    await api("/demo/seed", "POST", {});
    await refreshMemories();
    alert("Demo story seeded. Try asking: What database are we currently using?");
  } catch (e) {
    alert(e.message);
  } finally {
    $("seedBtn").disabled = false;
  }
});
$("refreshBtn").addEventListener("click", () => refreshMemories());

refreshMemories();
</script>
</body>
</html>
