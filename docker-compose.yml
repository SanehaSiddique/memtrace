services:
  memtrace:
    build: .
    ports:
      - "8000:8000"
    environment:
      MEMTRACE_DB_PATH: /data/memtrace.db
      MEMTRACE_ENV: ${MEMTRACE_ENV:-development}
      MEMTRACE_DEFAULT_AGENT_ID: ${MEMTRACE_DEFAULT_AGENT_ID:-agent-alpha}
      MEMTRACE_DEBUG: ${MEMTRACE_DEBUG:-true}
      # GROQ_API_KEY: ${GROQ_API_KEY:-}
      # GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      # OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      # OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-memtrace}

      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_DECIDE_URL: ${JEV_DECIDE_URL:-https://jevtypesafeai.com/api/v1/decide}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      G8_API_KEY: ${G8_API_KEY:-}
      G8_MCP_MODE: ${G8_MCP_MODE:-dev}
      POSTGRES_URL: ${POSTGRES_URL:-}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-memtrace-hackathon}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
    volumes:
      - memtrace_data:/data
    restart: unless-stopped

volumes:
  memtrace_data:

